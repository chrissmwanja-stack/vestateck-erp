name: Foundation checks

# Runs supabase/MIGRATION_POLICY.md's automated rules against new
# migration files on every push and PR, plus (as of 2026-08-18) three
# more gates prompted by the 17 Aug deep-audit's #2 P0 recommendation
# ("Add real CI"): a build+typecheck job, a from-scratch migration
# replay against a real local Supabase stack, and the tenant_id FK
# audit query from that same report (see scripts/audit_tenant_fk.sql
# for why it needs a BASE TABLE filter the report's raw query didn't
# have -- an unfiltered version permanently flags ~10 views).
#
# migration-policy stays narrow by design (see its own comment below).
# build, db-shadow-replay, and test are independent jobs -- neither
# blocks the other, so a broken migration doesn't hide a broken build
# or vice versa.
#
# test (added 2026-08-20) runs Vitest against apps/web/src/lib -- the
# small set of pure client-side logic (CSV/XLSX bulk-import parsing)
# that isn't already covered by db-shadow-replay, since that job only
# exercises SQL. Most business logic (approval thresholds, payroll,
# PO settlement) lives in SECURITY DEFINER functions and is out of
# scope for this job by design -- see apps/web/vitest.config.ts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  migration-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the diff against the base ref is meaningful

      # For pull_request, origin/main is still the unmerged target branch,
      # so diffing HEAD against it is meaningful. For push, by the time CI
      # runs, origin/main already includes the commit we're checking -- so
      # diffing against origin/main would always be empty and this check
      # would silently no-op on every push. Use the pre-push SHA
      # (github.event.before) instead, which git already has locally
      # thanks to fetch-depth: 0. Fall back to HEAD~1 for the edge case of
      # a force-push/new-branch push where `before` is the all-zero SHA.
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check new migrations against MIGRATION_POLICY.md
        run: |
          chmod +x scripts/check-migration-policy.sh
          ./scripts/check-migration-policy.sh "${{ steps.base.outputs.ref }}"

  # repo-hygiene: cheap, dependency-free checks on the repository itself. It
  # exists because unresolved merge-conflict markers were committed to main
  # twice (docs/insurance-brokerage/IN_FORCE_IMPORT.md, then
  # packages/shared/src/database.types.ts) and nothing noticed. Kept separate
  # from migration-policy, which stays narrow by design. Add it to the
  # branch-protection required checks so a failure blocks the merge.
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No unresolved merge-conflict markers
        run: |
          chmod +x scripts/check-conflict-markers.sh
          ./scripts/check-conflict-markers.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bumped from 20 -> 22: @supabase/supabase-js's package.json now
      # declares "engines": { "node": ">=22.0.0" } (confirmed via
      # `npm view @supabase/supabase-js engines` on 2026-08-19). CI was
      # still green on Node 20 -- npm only warns (EBADENGINE) rather
      # than failing the install -- but that warning was the exact
      # signal this repo was already carrying as a known-pending gap.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      # Root "build" script delegates to apps/web ("tsc -b && vite
      # build"), which project-references packages/shared -- so this
      # single command typechecks and builds both. Catches exactly the
      # class of bug the accept-invite/invite-user is_company_admin
      # change would have hit if database.types.ts hadn't been updated
      # to match: a silent runtime mismatch instead of a red PR check.
      - name: Typecheck + build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test --workspace=apps/web

  # `any` ratchet: apps/web still has a few hundred `any` uses in older pages, which
  # throw away the types generated from the database. This fails when a file gets MORE
  # of them than apps/web/eslint-any-baseline.json allows (a new file allows none), and
  # when a file gets fewer without the baseline being lowered, so progress is locked in.
  # See scripts/check-any-ratchet.mjs and apps/web/eslint.config.js.
  lint-any:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Check the no-explicit-any ratchet
        run: npm run lint:any --workspace=apps/web

  db-shadow-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # `supabase start` replays every file in supabase/migrations/ from
      # scratch against a throwaway local Postgres (via Docker) and then
      # applies seed.sql. This is the actual test for migration-history
      # health that the 17 Aug audit flagged as missing: a bad ordering,
      # a broken remote_schema dump, or a migration that only worked
      # because production already had the object it's creating, all
      # fail loudly here instead of surfacing on the next teammate's
      # fresh clone or the next `supabase db reset`.
      - name: Replay all migrations + seed from scratch
        run: supabase start

      # Static plpgsql lint (risks-gaps #4): plpgsql_check parses every
      # public plpgsql function body and flags unknown columns, ambiguous
      # references and type errors WITHOUT executing them -- the class of
      # bug that made every sap_payments insert fail at runtime until the
      # 16:00 fix. Requires the plpgsql_check extension in the local image;
      # if it is missing here, enable it in the Supabase config or install
      # it and re-run.
      - name: Static plpgsql lint (plpgsql_check)
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=1 -c "create extension if not exists plpgsql_check;"
          # The extension installs ~20 functions into public, which the later
          # `supabase gen types` step would then emit into database.types.ts
          # and report as drift. Remove it however this step ends.
          trap 'psql "$DB" -q -c "drop extension if exists plpgsql_check cascade;"' EXIT
          # plpgsql_check_function() returns text lines; the _tb variant is the
          # one that returns columns (lineno, sqlstate, message, ...). Trigger
          # functions must be checked against a trigger's table (relid).
          OUT=$(psql "$DB" -t -A -F '|' -c "
            select c.functionid::regprocedure::text, c.lineno, c.sqlstate, c.message
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            left join pg_trigger t on t.tgfoid = p.oid and not t.tgisinternal
            cross join lateral plpgsql_check_function_tb(
              p.oid, coalesce(t.tgrelid, 0), fatal_errors := false) c
            where n.nspname = 'public'
              and p.prolang = (select oid from pg_language where lanname = 'plpgsql')
              and c.level = 'error'
              -- Known false positives (verified 7 Nov 2026), narrowly scoped:
              -- (a) shared trigger functions that branch on tg_table_name are
              --     checked against EVERY table they are attached to, so they
              --     "miss" fields that only exist on another table's branch;
              -- (b) platform_fx_revalue_impl creates temp tables at runtime,
              --     which a static check cannot see.
              -- A genuine typo in any other function is still reported.
              and not (
                c.functionid::regprocedure::text = any(array[
                  'ins_cancellation_cash_evidence_guard()',
                  'ins_cancellation_evidence_guard()',
                  'ins_cancellation_finance_lock_guard()',
                  'prevent_journal_mutation()',
                  'prevent_posted_invoice_update()'])
                and c.sqlstate = '42703'
                and c.message ~ '^record .(old|new). has no field')
              and not (
                c.functionid::regprocedure::text = 'platform_fx_revalue_impl(uuid,date)'
                and ((c.sqlstate = '42P01' and c.message ~ 'reval_')
                  or (c.sqlstate = '55000' and c.message ~ 'record .r. is not assigned')))
            order by 1, 2")
          if [ -n "$OUT" ]; then
            echo "::error::plpgsql_check found problems in public plpgsql functions:"
            echo "$OUT"
            exit 1
          fi
          echo "plpgsql_check clean: no static errors in public plpgsql functions."

      # The tenant_id FK audit from the 17 Aug report, §4 -- corrected
      # to exclude views (see scripts/audit_tenant_fk.sql header).
      # Confirmed 0 rows against production on 2026-08-18; any output
      # here means a new BASE TABLE shipped with a tenant_id column but
      # no FK, i.e. a repeat of the gap 20260815063702 had to backfill
      # 53 tables for.
      - name: Audit tenant_id foreign keys
        run: |
          RESULT=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -t -A -f supabase/scripts/audit_tenant_fk.sql)
          if [ -n "$RESULT" ]; then
            echo "::error::Tables with tenant_id but no FK constraint:"
            echo "$RESULT"
            exit 1
          fi
          echo "Tenant FK audit clean -- no BASE TABLE with an unconstrained tenant_id column."

      # SECURITY DEFINER exposure audit (28 Sep 2026 review, priority 3).
      # Prints every client-executable definer function with a risk label
      # and FAILS on CRITICAL: takes a tenant id, mutates data, and its body
      # never consults an identity/tenant/permission helper. HIGH/REVIEW rows
      # are printed for triage but do not fail the build.
      - name: Audit SECURITY DEFINER function exposure
        run: |
          OUT=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -t -A -F '|' -f supabase/scripts/audit_security_definer.sql)
          echo "function|args|anon_exec|auth_exec|mutates|takes_tenant_id|has_guard|trigger_fn|risk"
          echo "$OUT"
          CRITICAL=$(echo "$OUT" | grep '|CRITICAL$' || true)
          if [ -n "$CRITICAL" ]; then
            echo "::error::Client-executable SECURITY DEFINER functions with a tenant parameter, mutations and no authorization guard:"
            echo "$CRITICAL"
            exit 1
          fi
          echo "SECURITY DEFINER audit: no CRITICAL exposures."

      # Generated types must match the migrations (12 Oct 2026 analysis, F4/F9).
      # The insurance client checks table and RPC names against
      # packages/shared/src/database.types.ts, so a stale file silently rejects
      # new objects (or accepts removed ones). Regenerates from this job's local
      # stack and compares ignoring line endings and the PostgREST version stamp.
      # Blocking since 16 Oct 2026: the committed file was regenerated from a clean
      # local replay of supabase/migrations with the same CLI version this job pins.
      # Fix a failure with scripts/gen-types.ps1 (UTF-8; a plain PowerShell `>` writes UTF-16).
      - name: Check generated types match the migrations
        run: |
          supabase gen types typescript --local --schema public > /tmp/types.local.ts
          # Normalise CLI-build formatting noise: CRLF, the two comment lines and
          # __InternalSupabase stamp, redundant parentheses the helper types get
          # in some builds, trailing blank lines, and a missing final newline.
          norm() { sed -e 's/\r$//' -e '/^  \/\/ Allows to automatically instantiate/d' -e '/^  \/\/ instead of createClient</d' -e '/__InternalSupabase/,/^  }$/d' -e 's/ extends (\([A-Za-z]*\) extends {$/ extends \1 extends {/' -e 's/^    : never) = never,$/    : never = never,/' -e '$a\' "$1" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'; }
          if ! diff <(norm packages/shared/src/database.types.ts) <(norm /tmp/types.local.ts) > /tmp/types.diff; then
            echo "::warning::packages/shared/src/database.types.ts is out of date with the migrations. Run scripts/gen-types.ps1 and commit the result."
            head -300 /tmp/types.diff
            exit 1
          fi
          echo "Generated types match the migrations."

      # Functional coverage for the accounting workstreams (A/B/F):
      # db-shadow-replay above only proves the migrations apply
      # cleanly -- it says nothing about whether GL posting actually
      # balances, whether a closed period actually blocks a write, or
      # whether the PAYE/NSSF math is right. \set ON_ERROR_STOP means
      # any RAISE EXCEPTION inside these files (an assertion failure)
      # makes psql exit non-zero and fails this step. Each file wraps
      # its own fixtures in BEGIN/ROLLBACK -- safe to run repeatedly,
      # local/CI database only (see each file's own header; never run
      # against a linked/remote project).
      - name: Functional tests -- GL posting, period close, statutory deductions, bank reconciliation
        run: |
          # pipefail is NOT on by default for `bash -e`; without it a psql
          # failure piped into tee would be masked by tee's exit status.
          set -o pipefail
          : > /tmp/sql-tests.log
          for f in supabase/tests/*.sql; do
            echo "::group::$f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee -a /tmp/sql-tests.log
            echo "::endgroup::"
          done
          # ON_ERROR_STOP only catches tests that RAISE EXCEPTION. A test that
          # reports a failure as a plain NOTICE/WARNING (or whose own FAIL
          # raise is swallowed by an `exception when others` handler that then
          # prints it) would exit 0 and go green. Scan the captured output.
          # Uppercase FAIL only: tests print "PASS: ..." / "FAIL: ..." and
          # security_authorization's summary line uses lowercase "failed".
          if grep -nE '(NOTICE|WARNING|INFO|LOG): +.*\bFAIL' /tmp/sql-tests.log > /tmp/sql-tests.fail; then
            echo "::error::SQL tests printed FAIL without raising an exception:"
            cat /tmp/sql-tests.fail
            exit 1
          fi
          echo "SQL tests: $(grep -c 'NOTICE: *PASS' /tmp/sql-tests.log) PASS notices, no silent FAIL output."

  # Insurance concurrency races (risks-gaps #5): the scripts under
  # scripts/test-ins-*-concurrency.ts were previously manual-only. They
  # drive real two-connection PostgreSQL races against disposable
  # *_cash_test databases, so they now run on every push like the SQL
  # suite. The scripts refuse any non-local target themselves.
  insurance-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local stack
        run: supabase start

      # A bare `create database` has no `extensions`, `auth` or `storage`
      # schemas (the baseline migration fails on `extensions`), so replaying
      # migrations into it cannot work. `supabase start` already produced a
      # fully migrated database, so clone it as a template instead. A template
      # source must have no other sessions, and the stack's services reconnect
      # the instant they are terminated, so: connect via template1, forbid new
      # connections to `postgres`, terminate the existing ones, clone, then
      # allow connections again (always, via the trap).
      - name: Create disposable, migrated concurrency databases
        run: |
          ADMIN="postgresql://supabase_admin:postgres@127.0.0.1:54322/template1"
          p() { psql "$ADMIN" -v ON_ERROR_STOP=1 -q -At "$@"; }
          trap 'p -c "alter database postgres with allow_connections true;"' EXIT
          p -c "alter database postgres with allow_connections false;"
          for i in $(seq 1 15); do
            p -c "select pg_terminate_backend(pid) from pg_stat_activity where datname = 'postgres' and pid <> pg_backend_pid();" >/dev/null
            n=$(p -c "select count(*) from pg_stat_activity where datname = 'postgres';")
            [ "$n" = "0" ] && break
            sleep 1
          done
          [ "$n" = "0" ] || { echo "::error::$n sessions still hold postgres open"; p -c "select pid, usename, application_name, backend_type from pg_stat_activity where datname = 'postgres';"; exit 1; }
          for d in premium_cash_test coinsurance_cash_test; do
            p -c "drop database if exists $d;"
            p -c "create database $d template postgres;"
          done

      - name: Run insurance concurrency scripts
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: '54322'
        run: |
          PGDATABASE=premium_cash_test node scripts/test-ins-policy-cash-concurrency.ts
          PGDATABASE=coinsurance_cash_test node scripts/test-ins-cancellation-concurrency.ts
          PGDATABASE=coinsurance_cash_test node scripts/test-ins-cancellation-cash-concurrency.ts
          PGDATABASE=coinsurance_cash_test node scripts/test-ins-coinsurance-concurrency.ts