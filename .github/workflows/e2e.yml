name: E2E smoke tests

# Runs the three Playwright money-flow specs (procurement -> PO, supplier
# invoice -> settlement, payroll run -> disbursement) against a real,
# freshly-seeded local Supabase stack -- the same stack db-shadow-replay
# in foundation-checks.yml proves clean, plus seed.sql on top.
#
# Deliberately a SEPARATE workflow from foundation-checks.yml rather than
# a fifth job there: e2e needs the whole local stack up and takes a few
# minutes, and its failures are integration failures (seed gaps, RLS
# policy mistakes, RPC drift) that deserve their own signal instead of
# being buried in the foundation gate. Nothing merges if it's red once
# branch protection is on, of course.
#
# Prereqs the specs assume come from supabase/seed.sql on a fresh stack:
# the 7 @test.local accounts, finance/HR team memberships, payroll
# approver, employees + compensation, PAYE/NSSF rates, org/cost centers/
# vendor account, and demo materials. If a spec starts failing on a
# missing fixture, fix seed.sql -- not the spec.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Fresh runner => fresh containers => migrations + seed.sql both
      # apply on first start (same job shape as foundation-checks' green
      # db-shadow-replay job, which also boots the stack from scratch).
      - name: Start local Supabase (migrations + seed)
        run: supabase start

      # The web app under test needs apps/web/.env to point at this
      # freshly-started stack. Playwright's global-setup prints the URL
      # at run start, which doubles as CI self-documentation in logs.
      - name: Point the web app at the local stack
        shell: bash
        run: |
          SUPABASE_STATUS="$(supabase status -o env)"
          ANON_KEY="$(printf '%s\n' "$SUPABASE_STATUS" | sed -n 's/^ANON_KEY="\(.*\)"/\1/p')"
          if [ -z "$ANON_KEY" ]; then
            echo "::error::Could not read ANON_KEY from 'supabase status -o env'"
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=http://127.0.0.1:54321\nVITE_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY" > apps/web/.env
          echo "Wrote apps/web/.env -> http://127.0.0.1:54321"

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        working-directory: apps/web
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
