name: Supabase keep-alive

# Pings the VestaTeck ERP Supabase project so the free tier never pauses
# from inactivity (pauses after ~7 days without activity).
on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days at 06:00 UTC
  workflow_dispatch: {}      # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive_ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            status=$(curl -s -o response.json -w "%{http_code}" \
              -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Attempt $attempt -> HTTP $status"
            cat response.json; echo
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Keep-alive failed after 3 attempts" >&2
          exit 1
